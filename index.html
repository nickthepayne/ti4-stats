<!doctype html>
<html lang="en">
<meta charset="utf-8">
<!-- Archive index for the stats site. Rendered by scripts/game-report.py from each game day's meta.json. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TI4 Game Days</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Saira:wght@400;600&display=swap">
<style>
:root { color-scheme: dark; --void:#04060c; --hull:#0a1020; --line:#26355a; --brass:#c9a24a; --brass-hi:#f2d283; --ink:#efe6cf; --ink-mid:#aab6cc; --ink-dim:#7d8bab; }
body { margin:0; background: var(--void) radial-gradient(1200px 500px at 50% -10%, #0f1a36 0%, transparent 70%) no-repeat; color: var(--ink); font-family: 'Saira', 'Arial Narrow', sans-serif; font-size:16px; }
main { max-width: 760px; margin: 0 auto; padding-inline: 20px; padding-block: 48px; display: grid; gap: 28px; }
h1 { font-family: 'Michroma', 'Arial Black', sans-serif; font-weight: 400; color: var(--brass-hi); letter-spacing: .06em; margin: 0; font-size: clamp(26px, 5vw, 40px); }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
a { display: grid; gap: 2px; padding: 16px 18px; background: var(--hull); border: 1px solid var(--line); color: inherit; text-decoration: none; }
a:hover, a:focus-visible { border-color: var(--brass); outline: none; }
a b { font-size: 18px; font-weight: 600; } a span { color: var(--ink-mid); font-size: 14px; }
</style>
<main>
  <div class="eyebrow">Twilight Imperium · Adi, Matze, Nick, Silvan</div>
  <h1>Game Days</h1>
  <ul>
    <li><a href="2026-10-10/"><b>Saturday 10 October 2026</b><span>Won by Adi (Saar) · 5 rounds · 7h 03m · 11 battles</span></a></li>
  </ul>
</main>
</html>
